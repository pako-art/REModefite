plugins {
	id 'java'
	id 'net.neoforged.moddev' version '2.0.141'
}

base {
	archivesName = project.archives_base_name
	version = project.mod_version
	group = project.maven_group
}

java {
	withSourcesJar()
	toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
	mavenCentral()
}

neoForge {
	version = project.neoforge_version

	// NeoForge ships official (Mojang) mappings at both compile and runtime,
	// so no refmap is needed - unlike the Fabric/Yarn original, which declared
	// "refmap": "modefite.refmap.json" in its mixin configs.
	runs {
		client {
			client()
		}
	}

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
	def expandProps = [
		'version'          : project.version,
		'mod_id'           : project.mod_id,
		'minecraft_version': project.minecraft_version,
		'neoforge_version' : project.neoforge_version
	]
	inputs.properties(expandProps)
	filesMatching(['META-INF/neoforge.mods.toml']) {
		expand expandProps
	}
}

tasks.named('jar', Jar).configure {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}
